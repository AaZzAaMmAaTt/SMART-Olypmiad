<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART Olympiad — Science · Math · Academy · Research · Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
/* ============================================================================
   SMART OLYMPIAD — PREMIUM REDESIGN v3.0
   Modern · Polished · Elegant · Fully Functional
   ============================================================================ */

/* === RESET === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;color:#1a1a2e;background:#fafbfc;overflow-x:hidden;position:relative}
h1,h2,h3,h4,h5,h6{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;line-height:1.15;color:#0d0d1a}
a{text-decoration:none;color:inherit;transition:all .3s ease}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul{list-style:none}
img{max-width:100%;display:block}
svg{display:inline-block;vertical-align:middle}
::selection{background:rgba(247,165,36,.2);color:#0d0d1a}

/* === CSS VARIABLES === */
:root{
  --primary:#f7a524;
  --primary-dark:#e08d0d;
  --primary-light:#ffca6a;
  --primary-subtle:rgba(247,165,36,.06);
  --primary-glow:rgba(247,165,36,.15);
  --dark:#0d0d1a;
  --dark-800:#161625;
  --dark-700:#1e1e33;
  --dark-600:#2a2a42;
  --gray-900:#1a1a2e;
  --gray-800:#2d2d44;
  --gray-700:#3d3d56;
  --gray-600:#555570;
  --gray-500:#7a7a92;
  --gray-400:#9e9eb5;
  --gray-300:#c4c4d4;
  --gray-200:#e0e0ea;
  --gray-100:#f0f0f5;
  --gray-50:#f8f8fb;
  --white:#ffffff;
  --success:#10b981;
  --success-bg:rgba(16,185,129,.08);
  --error:#ef4444;
  --error-bg:rgba(239,68,68,.08);
  --info:#3b82f6;
  --info-bg:rgba(59,130,246,.08);
  --radius-xs:4px;
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:12px;
  --radius-xl:16px;
  --radius-2xl:20px;
  --radius-3xl:24px;
  --radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 2px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.1);
  --shadow-xl:0 16px 48px rgba(0,0,0,.12);
  --shadow-2xl:0 24px 64px rgba(0,0,0,.16);
  --shadow-glow:0 0 40px rgba(247,165,36,.15);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --duration:.3s;
  --duration-slow:.5s;
  --nav-h:68px;
}

/* === ANIMATED BACKGROUND === */
.bg-animation{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-mesh{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 600px 600px at 10% 20%,rgba(247,165,36,.04),transparent),
    radial-gradient(ellipse 500px 500px at 80% 70%,rgba(59,130,246,.03),transparent),
    radial-gradient(ellipse 400px 400px at 50% 50%,rgba(168,85,247,.02),transparent);
  animation:meshFloat 30s ease-in-out infinite;
}
@keyframes meshFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(20px,-15px) scale(1.02)}
  66%{transform:translate(-15px,20px) scale(.98)}
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.015) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black,transparent);
}
.bg-particles{position:absolute;inset:0}
.particle{
  position:absolute;
  width:3px;height:3px;
  border-radius:50%;
  opacity:0;
  animation:particleRise linear infinite;
}
@keyframes particleRise{
  0%{transform:translateY(0) translateX(0);opacity:0}
  8%{opacity:.6}
  88%{opacity:.6}
  100%{transform:translateY(-100vh) translateX(var(--dx));opacity:0}
}

/* === LOADING SCREEN === */
#loader{
  position:fixed;inset:0;z-index:99999;
  background:var(--dark);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .8s var(--ease),visibility .8s;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-inner{text-align:center;position:relative}
.loader-ring{
  width:120px;height:120px;margin:0 auto 32px;position:relative;
}
.loader-ring svg{
  width:120px;height:120px;
  animation:ringRotate 2s linear infinite;
}
.loader-ring circle{
  fill:none;stroke-width:2;stroke-linecap:round;
}
.loader-ring .ring-bg{stroke:rgba(255,255,255,.06)}
.loader-ring .ring-fill{
  stroke:var(--primary);
  stroke-dasharray:300;
  stroke-dashoffset:300;
  animation:ringDash 2.5s var(--ease) forwards;
  filter:drop-shadow(0 0 8px rgba(247,165,36,.4));
}
@keyframes ringRotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes ringDash{to{stroke-dashoffset:0}}
.loader-logo{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:52px;height:52px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:28px;color:var(--white);
  animation:logoReveal .6s var(--ease-bounce) .3s both;
  box-shadow:0 0 40px rgba(247,165,36,.3);
}
@keyframes logoReveal{from{transform:translate(-50%,-50%) scale(0) rotate(-180deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
.loader-text{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:28px;color:var(--white);
  letter-spacing:-1px;
  animation:textSlide .5s var(--ease) .7s both;
}
.loader-text span{color:var(--primary)}
@keyframes textSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.loader-sub{
  font-size:11px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin-top:8px;
  animation:textSlide .5s var(--ease) 1s both;
}
.loader-bar{
  width:180px;height:2px;background:rgba(255,255,255,.06);
  border-radius:99px;margin:20px auto 0;overflow:hidden;
  animation:textSlide .5s var(--ease) 1.2s both;
}
.loader-bar-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--primary),var(--primary-light));
  border-radius:99px;
  animation:barGrow 1.8s var(--ease) 1.4s forwards;
  box-shadow:0 0 12px rgba(247,165,36,.4);
}
@keyframes barGrow{to{width:100%}}

/* === NAVIGATION === */
#main-nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--nav-h);
  background:rgba(13,13,26,.92);
  backdrop-filter:blur(24px) saturate(1.2);
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:all var(--duration) var(--ease);
}
#main-nav.scrolled{
  background:rgba(13,13,26,.97);
  box-shadow:0 4px 30px rgba(0,0,0,.2);
}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  height:var(--nav-h);
}
.logo{display:flex;align-items:center;gap:10px;transition:all var(--duration) var(--ease)}
.logo:hover{transform:translateY(-1px)}
.logo-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:18px;color:var(--white);
  box-shadow:0 2px 8px rgba(247,165,36,.25);
  transition:all var(--duration) var(--ease);
}
.logo:hover .logo-icon{box-shadow:0 4px 16px rgba(247,165,36,.35);transform:rotate(-3deg)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--white);letter-spacing:-.5px}
.logo-text span{color:var(--primary)}

.desktop-links{display:flex;align-items:center;gap:2px}
.nav-link{
  color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;
  padding:7px 13px;border-radius:var(--radius-md);
  transition:all var(--duration) var(--ease);position:relative;
}
.nav-link::after{
  content:'';position:absolute;bottom:2px;left:50%;
  transform:translateX(-50%) scaleX(0);
  width:16px;height:2px;background:var(--primary);border-radius:99px;
  transition:all var(--duration) var(--ease);
}
.nav-link:hover,.nav-link.active{color:rgba(255,255,255,.95);background:rgba(255,255,255,.06)}
.nav-link.active::after{transform:translateX(-50%) scaleX(1);width:24px}
.nav-cta-btn{
  margin-left:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:var(--white);font-weight:600;font-size:13px;
  padding:8px 22px;border-radius:var(--radius-full);
  box-shadow:0 2px 8px rgba(247,165,36,.25);
  transition:all var(--duration) var(--ease);
}
.nav-cta-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(247,165,36,.35)}

/* Desktop dropdown */
.nav-dropdown{position:relative}
.nav-dropdown-btn{display:flex;align-items:center;gap:6px}
.nav-dropdown-caret{width:14px;height:14px;opacity:.65;transition:transform var(--duration) var(--ease)}
.nav-dropdown-menu{
  position:absolute;top:calc(100% + 10px);left:0;min-width:240px;
  background:rgba(13,13,26,.98);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:8px;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  opacity:0;transform:translateY(-6px) scale(.98);
  pointer-events:none;
  transition:opacity var(--duration) var(--ease),transform var(--duration) var(--ease);
}
.nav-dropdown:hover .nav-dropdown-menu,
.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.nav-dropdown:hover .nav-dropdown-caret,
.nav-dropdown:focus-within .nav-dropdown-caret{transform:rotate(180deg)}
.nav-dropdown-link{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  color:rgba(255,255,255,.65);font-size:13.5px;font-weight:500;
  transition:all var(--duration) var(--ease);
}
.nav-dropdown-link:hover{color:rgba(255,255,255,.95);background:rgba(255,255,255,.06)}
.nav-dropdown-sep{height:1px;background:rgba(255,255,255,.06);margin:6px 6px}

/* Mobile nav */
.hamburger{display:none;width:36px;height:36px;border-radius:var(--radius-md);align-items:center;justify-content:center;transition:all var(--duration) var(--ease)}
.hamburger:hover{background:rgba(255,255,255,.06)}
.hamburger-lines{display:flex;flex-direction:column;gap:5px;width:18px}
.hamburger-lines span{display:block;width:100%;height:1.5px;background:var(--white);border-radius:99px;transition:all var(--duration) var(--ease);transform-origin:center}
.hamburger.active .hamburger-lines span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px)}
.hamburger.active .hamburger-lines span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.active .hamburger-lines span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px)}

.mobile-nav{
  display:none;position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  background:rgba(13,13,26,.98);backdrop-filter:blur(24px);
  padding:20px 24px 30px;z-index:999;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.mobile-nav.open{display:flex;flex-direction:column;gap:2px;animation:mobileSlide .3s var(--ease);max-height:calc(100dvh - var(--nav-h))}
@keyframes mobileSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.mob-link{
  color:rgba(255,255,255,.6);font-size:15px;font-weight:500;
  padding:14px 16px;border-radius:var(--radius-lg);
  transition:all var(--duration) var(--ease);
  display:flex;align-items:center;gap:10px;
}
.mob-link:hover,.mob-link.active{color:var(--white);background:rgba(255,255,255,.05)}
.mob-link .mob-icon{width:18px;height:18px;opacity:.5}
.mob-link.active .mob-icon{opacity:1;color:var(--primary)}
.mob-top-actions{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mob-more{display:none;flex-direction:column;gap:2px;padding-left:6px}
.mob-more.open{display:flex;animation:mobileSlide .25s var(--ease)}
.mob-more-toggle{justify-content:space-between}
.mob-more-toggle .mob-caret{width:18px;height:18px;opacity:.55;transition:transform var(--duration) var(--ease)}
.mob-more-toggle.open .mob-caret{transform:rotate(180deg)}

@media(max-width:900px){
  .desktop-links{display:none}
  .hamburger{display:flex}
}

/* === COUNTDOWN === */
.countdown-bar{
  margin-top:var(--nav-h);
  background:linear-gradient(90deg,var(--dark),var(--dark-700));
  border-bottom:1px solid rgba(247,165,36,.15);
  padding:10px 0;position:relative;overflow:hidden;
}
.countdown-bar::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);
}
.countdown-inner{
  display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;
}
.cd-label{color:rgba(255,255,255,.7);font-size:13px;font-weight:500}
.cd-label strong{color:var(--primary);font-weight:700}
.cd-blocks{display:flex;gap:6px}
.cd-block{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-md);padding:4px 10px;text-align:center;min-width:50px;
  transition:all var(--duration) var(--ease);
}
.cd-block:hover{background:rgba(255,255,255,.08);border-color:rgba(247,165,36,.2);transform:translateY(-1px)}
.cd-num{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--primary);line-height:1.3}
.cd-unit{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1.5px}
.cd-btn{
  background:var(--primary);color:var(--white);border:none;
  padding:6px 16px;border-radius:var(--radius-full);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  transition:all var(--duration) var(--ease);
  display:flex;align-items:center;gap:5px;
}
.cd-btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.cd-btn svg{width:12px;height:12px}

/* === LAYOUT === */
.container{max-width:1360px;margin:0 auto;padding:0 2rem}
main{min-height:100vh;position:relative;z-index:1}
.page{animation:pageIn .6s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* === ICONS (SVG-based) === */
.icon{width:20px;height:20px;flex-shrink:0}
.icon-sm{width:16px;height:16px}
.icon-lg{width:24px;height:24px}
.icon-xl{width:32px;height:32px}

/* === BUTTONS === */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:14px;
  padding:12px 28px;border-radius:var(--radius-full);border:none;cursor:pointer;
  transition:all var(--duration) var(--ease);position:relative;overflow:hidden;
  letter-spacing:-.01em;
}
.btn svg{width:16px;height:16px;transition:transform var(--duration) var(--ease)}
.btn:hover svg{transform:translateX(2px)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:var(--white);box-shadow:0 4px 16px rgba(247,165,36,.25);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(247,165,36,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:var(--dark);color:var(--white);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-secondary:hover{transform:translateY(-2px);background:var(--dark-700)}
.btn-ghost{
  background:transparent;color:var(--gray-800);
  border:1.5px solid var(--gray-200);
}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.btn-sm{padding:8px 18px;font-size:13px}
.btn-lg{padding:14px 36px;font-size:15px}

/* === CARDS === */
.card{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-xl);padding:28px;
  transition:all var(--duration) var(--ease);position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-light));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s var(--ease);
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:rgba(247,165,36,.2);
}
.card:hover::before{transform:scaleX(1)}

.card-detail-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--primary);
  opacity:0;transform:translateY(4px);
  transition:all var(--duration) var(--ease);
}
.card:hover .card-detail-link{opacity:1;transform:translateY(0)}
.card-detail-link svg{width:14px;height:14px;transition:transform var(--duration) var(--ease)}
.card:hover .card-detail-link svg{transform:translateX(3px)}

/* === COURSE CARDS === */
.course-card{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-xl);overflow:hidden;
  transition:all var(--duration) var(--ease);cursor:pointer;
  display:flex;flex-direction:column;
}
.course-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 32px rgba(0,0,0,.1);
  border-color:rgba(247,165,36,.2);
}
.course-card-top{
  padding:24px 24px 0;flex:1;
}
.course-card-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--primary-subtle);color:var(--primary-dark);
  font-size:11px;font-weight:700;padding:4px 12px;
  border-radius:var(--radius-full);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:14px;
}
.course-card-badge svg{width:12px;height:12px}
.course-card-title{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--dark);line-height:1.3}
.course-card-desc{font-size:13px;color:var(--gray-500);line-height:1.6;margin-bottom:16px}
.course-card-meta{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:12px;color:var(--gray-500);margin-bottom:8px;
}
.course-card-meta-item{display:flex;align-items:center;gap:4px}
.course-card-meta-item svg{width:14px;height:14px;color:var(--gray-400)}
.course-card-bottom{
  padding:16px 24px;border-top:1px solid var(--gray-100);
  display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;
}
.course-price{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;color:var(--dark)}
.course-price .currency{font-size:14px;color:var(--gray-500);font-weight:500}
.course-rating{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--gray-700)}
.course-rating svg{width:14px;height:14px;color:var(--primary)}

/* === FORMS === */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.form-input,.form-select,.form-textarea{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--gray-200);border-radius:var(--radius-lg);
  font-family:inherit;font-size:14px;color:var(--dark);
  background:var(--white);
  transition:all var(--duration) var(--ease);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow);
}
.form-input::placeholder{color:var(--gray-400)}
.form-textarea{resize:vertical;min-height:120px}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

/* === FILTER TABS === */
.filter-tabs{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;
}
.filter-tab{
  display:flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:var(--radius-full);
  font-size:13px;font-weight:600;color:var(--gray-600);
  background:var(--white);border:1.5px solid var(--gray-200);
  transition:all var(--duration) var(--ease);cursor:pointer;
}
.filter-tab svg{width:16px;height:16px}
.filter-tab .icon-sm{display:inline-flex;align-items:center;justify-content:center}
.filter-tab svg{transition:transform .4s var(--ease-bounce),filter .4s var(--ease)}
.filter-tab:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-subtle)}
.filter-tab:hover svg{transform:translateY(-1px) rotate(-8deg);filter:drop-shadow(0 10px 20px rgba(247,165,36,.18))}
.filter-tab.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:var(--white);border-color:transparent;
  box-shadow:0 2px 8px rgba(247,165,36,.25);
}
.filter-tab.active svg{color:var(--white)}

/* === MODAL === */
.modal-overlay{
  position:fixed;inset:0;z-index:10000;
  display:none;align-items:center;justify-content:center;padding:1.5rem;
}
.modal-overlay.open{display:flex;animation:fadeIn .2s var(--ease)}
.modal-backdrop{
  position:absolute;inset:0;
  background:rgba(13,13,26,.7);backdrop-filter:blur(8px);
}
.modal-container{
  position:relative;background:var(--white);border-radius:var(--radius-2xl);
  max-width:900px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-2xl);animation:modalUp .4s var(--ease-bounce);z-index:1;
}
@keyframes modalUp{from{opacity:0;transform:scale(.95) translateY(-16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{
  position:absolute;top:14px;right:14px;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);border:none;cursor:pointer;
  color:rgba(255,255,255,.7);
  transition:all var(--duration) var(--ease);z-index:10;
}
.modal-close:hover{background:var(--primary);color:var(--white);transform:rotate(90deg)}
.modal-close svg{width:18px;height:18px}
.modal-header{
  padding:36px 36px 28px;
  background:linear-gradient(135deg,var(--dark),var(--dark-700));
  border-radius:var(--radius-2xl) var(--radius-2xl) 0 0;
  position:relative;overflow:hidden;
}
.modal-header::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(247,165,36,.06),transparent 60%);
}
.modal-header>*{position:relative;z-index:1}
.modal-header-icon{
  width:48px;height:48px;border-radius:14px;
  background:rgba(247,165,36,.1);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.modal-header-icon svg{width:24px;height:24px;color:var(--primary)}
.modal-title{font-size:24px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.modal-subtitle{color:rgba(255,255,255,.5);font-size:14px;margin-top:6px}
.modal-body{padding:32px 36px}

/* === TOAST === */
#toast-container{
  position:fixed;top:80px;right:20px;z-index:10001;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  pointer-events:auto;
  background:var(--white);border-radius:var(--radius-lg);
  padding:14px 18px;box-shadow:var(--shadow-xl);
  display:flex;align-items:center;gap:12px;
  border-left:3px solid var(--success);
  animation:toastIn .4s var(--ease-bounce);
  min-width:300px;max-width:400px;
}
.toast.error{border-left-color:var(--error)}
.toast.info{border-left-color:var(--info)}
.toast-icon{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.toast-icon.success{background:var(--success-bg);color:var(--success)}
.toast-icon.error{background:var(--error-bg);color:var(--error)}
.toast-icon.info{background:var(--info-bg);color:var(--info)}
.toast-icon svg{width:16px;height:16px}
.toast-content{flex:1}
.toast-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:1px}
.toast-msg{font-size:12px;color:var(--gray-500);line-height:1.4}
.toast-close{
  background:none;border:none;color:var(--gray-400);cursor:pointer;
  padding:4px;transition:color var(--duration) var(--ease);
}
.toast-close:hover{color:var(--dark)}
.toast-close svg{width:14px;height:14px}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast.removing{animation:toastOut .3s var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* === SCROLL TO TOP === */
.scroll-top-btn{
  position:fixed;bottom:28px;right:28px;
  width:48px;height:48px;border-radius:50%;
  background:var(--dark);color:var(--white);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:all var(--duration) var(--ease);z-index:999;
  border:1px solid rgba(255,255,255,.06);
}
.scroll-top-btn.show{opacity:1;visibility:visible;transform:translateY(0)}
.scroll-top-btn:hover{
  background:var(--primary);transform:translateY(-4px);
  box-shadow:0 8px 24px rgba(247,165,36,.3);
}
.scroll-top-btn svg{width:18px;height:18px}

/* === SECTION HEADERS === */
.section-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;color:var(--primary);
  text-transform:uppercase;letter-spacing:2.5px;margin-bottom:12px;
}
.section-label .label-dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);
}
.section-title{
  font-size:clamp(28px,4vw,44px);font-weight:800;
  letter-spacing:-.02em;margin-bottom:12px;
}
.section-desc{
  font-size:16px;color:var(--gray-500);max-width:580px;
  margin:0 auto;line-height:1.7;
}

/* === HERO === */
.hero{
  padding:100px 0 80px;position:relative;overflow:hidden;
}
.hero-content{text-align:center;position:relative;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--primary-subtle);border:1px solid rgba(247,165,36,.12);
  color:var(--primary-dark);font-size:12px;font-weight:700;
  padding:6px 16px;border-radius:var(--radius-full);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:24px;
}
.hero-badge svg{width:14px;height:14px}
.hero-title{
  font-size:clamp(38px,5.5vw,64px);font-weight:900;
  letter-spacing:-2px;margin-bottom:20px;line-height:1.1;
}
.hero-title .accent{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-subtitle{
  font-size:18px;color:var(--gray-500);max-width:560px;
  margin:0 auto 36px;line-height:1.7;
}
.hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* === STATS === */
.stats-strip{
  background:var(--dark);padding:48px 0;position:relative;overflow:hidden;
}
.stats-strip::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 50%,rgba(247,165,36,.06),transparent 60%);
}
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative;z-index:1;
}
.stat-item{text-align:center;padding:20px}
.stat-num{
  font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:800;
  color:var(--primary);margin-bottom:4px;
}
.stat-text{font-size:13px;color:rgba(255,255,255,.5);font-weight:500}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

/* === PILLAR GRID === */
.pillar-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
}
@media(max-width:900px){.pillar-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.pillar-grid{grid-template-columns:repeat(2,1fr)}}
.pillar-card{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-xl);padding:24px 18px;text-align:center;
  cursor:pointer;transition:all var(--duration) var(--ease);position:relative;overflow:hidden;
}
.pillar-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--primary-subtle),transparent);
  opacity:0;transition:opacity var(--duration) var(--ease);
}
.pillar-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 32px rgba(0,0,0,.08);
  border-color:rgba(247,165,36,.2);
}
.pillar-card:hover::before{opacity:1}
.pillar-card>*{position:relative;z-index:1}
.pillar-icon-box{
  width:48px;height:48px;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;color:var(--white);
  box-shadow:0 4px 12px rgba(247,165,36,.2);
  transition:transform var(--duration) var(--ease);
}
.pillar-icon-box svg{width:24px;height:24px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.18));animation:pillarFloat 3.8s ease-in-out infinite}
.pillar-card:hover .pillar-icon-box svg{transform:rotate(10deg) scale(1.06)}
@keyframes pillarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pillar-card:hover .pillar-icon-box{transform:scale(1.08) rotate(-3deg)}
.pillar-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--dark);margin-bottom:6px}
.pillar-desc{font-size:12px;color:var(--gray-500);line-height:1.5}

/* === TIERS === */
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:768px){.tier-grid{grid-template-columns:1fr}}
.tier-card{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-xl);padding:32px;text-align:center;
  cursor:pointer;transition:all var(--duration) var(--ease);
}
.tier-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:rgba(247,165,36,.2)}
.tier-num{
  font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:900;
  color:var(--primary);line-height:1;margin-bottom:8px;
}
.tier-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.tier-desc{font-size:13px;color:var(--gray-500);line-height:1.5}

/* === PRICING === */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
@media(max-width:768px){.pricing-grid{grid-template-columns:1fr;max-width:420px;margin:0 auto}}
.pricing-card{
  background:var(--white);border:1.5px solid var(--gray-200);
  border-radius:var(--radius-2xl);padding:32px;transition:all var(--duration) var(--ease);
  position:relative;
}
.pricing-card.featured{
  border-color:var(--primary);
  box-shadow:0 16px 48px rgba(247,165,36,.15);
  transform:scale(1.03);
}
.pricing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-xl)}
.pricing-card.featured:hover{transform:scale(1.03) translateY(-4px)}
.pricing-featured-badge{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:var(--white);font-size:11px;font-weight:700;padding:4px 16px;
  border-radius:var(--radius-full);text-transform:uppercase;letter-spacing:.5px;
  white-space:nowrap;
}
.pricing-name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px}
.pricing-ages{color:var(--primary-dark);font-weight:600;font-size:14px;margin-bottom:16px}
.pricing-amount{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:900;color:var(--dark);line-height:1}
.pricing-period{font-size:13px;color:var(--gray-400);margin-top:4px}
.pricing-features{margin:24px 0;display:flex;flex-direction:column;gap:10px}
.pricing-feature{display:flex;align-items:start;gap:10px;font-size:13.5px;color:var(--gray-600);text-align:left}
.pricing-feature svg{width:16px;height:16px;color:var(--success);flex-shrink:0;margin-top:2px}

/* === FOOTER === */
footer{
  background:var(--dark);color:var(--white);
  padding:56px 0 28px;position:relative;overflow:hidden;
}
footer::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 20%,rgba(247,165,36,.04),transparent 60%);
}
.footer-main{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;
  position:relative;z-index:1;padding-bottom:36px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
@media(max-width:768px){.footer-main{grid-template-columns:1fr 1fr;gap:28px}}
@media(max-width:480px){.footer-main{grid-template-columns:1fr}}
.footer-brand{max-width:300px}
.footer-brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.footer-desc{font-size:13px;color:rgba(255,255,255,.4);line-height:1.7}
.footer-heading{
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  color:var(--white);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;
}
.footer-links{display:flex;flex-direction:column;gap:8px}
.footer-link{
  font-size:13px;color:rgba(255,255,255,.4);
  transition:all var(--duration) var(--ease);
  display:flex;align-items:center;gap:6px;
}
.footer-link:hover{color:var(--primary);transform:translateX(3px)}
.footer-bottom{
  position:relative;z-index:1;
  padding-top:24px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
}
.footer-copy{font-size:12px;color:rgba(255,255,255,.25)}
.footer-bottom-links{display:flex;gap:16px}
.footer-bottom-link{font-size:12px;color:rgba(255,255,255,.3);transition:color var(--duration) var(--ease)}
.footer-bottom-link:hover{color:var(--primary)}

/* === FAQ === */
.faq-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.faq-item{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-lg);overflow:hidden;
  transition:all var(--duration) var(--ease);
}
.faq-item:hover{border-color:rgba(247,165,36,.15)}
.faq-item.open{border-color:rgba(247,165,36,.25);box-shadow:0 4px 16px rgba(247,165,36,.06)}
.faq-question{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;cursor:pointer;font-weight:600;font-size:15px;color:var(--dark);
  transition:background var(--duration) var(--ease);gap:16px;
}
.faq-question:hover{background:var(--gray-50)}
.faq-item.open .faq-question{color:var(--primary)}
.faq-chevron{
  width:20px;height:20px;flex-shrink:0;color:var(--gray-400);
  transition:transform var(--duration) var(--ease);
}
.faq-item.open .faq-chevron{transform:rotate(180deg);color:var(--primary)}
.faq-answer{
  max-height:0;overflow:hidden;transition:max-height .35s var(--ease);
}
.faq-answer-inner{
  padding:0 22px 18px;font-size:14px;color:var(--gray-500);line-height:1.7;
}

/* === CTA SECTION === */
.cta-section{
  background:linear-gradient(135deg,var(--dark),var(--dark-700));
  border-radius:var(--radius-3xl);padding:56px 40px;
  text-align:center;position:relative;overflow:hidden;
}
.cta-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(247,165,36,.08),transparent 60%);
}
.cta-section>*{position:relative;z-index:1}

/* === RESPONSIVE === */
@media(max-width:768px){
  .container{padding:0 1.25rem}
  .hero-title{letter-spacing:-1px}
  .scroll-top-btn{width:42px;height:42px;bottom:20px;right:20px}
}

/* === ANIMATION UTILITIES === */
.fade-in{opacity:0;transform:translateY(20px);transition:all .6s var(--ease)}
.fade-in.visible{opacity:1;transform:translateY(0)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* === PRINT === */
@media print{
  #main-nav,.countdown-bar,.scroll-top-btn,.bg-animation,#loader{display:none !important}
  body{background:white;color:black}
}
  </style>
</head>

// === GLOBAL HELPERS ===
function formatMoney(amount){
  const value=Number(amount)||0;
  return `${value.toLocaleString('en-US')} UZS`;
}
function escapeHTML(str=''){
  return String(str).replace(/[&<>'"]/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'
  }[ch]));
}

// === INIT PARTICLES ===
function initParticles(){
  const c=document.getElementById('particles-container');
  if(!c)return;
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.top=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=Math.random()*5+'s';
    p.style.setProperty('--dx',(Math.random()*80-40)+'px');
    const sz=2+Math.random()*2;
    p.style.width=sz+'px';p.style.height=sz+'px';
    const colors=['rgba(247,165,36,.5)','rgba(59,130,246,.35)','rgba(168,85,247,.35)'];
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.appendChild(p);
  }
}

// === COUNTDOWN ===
function updateCountdown(){
  const target=new Date('2026-07-15T09:00:00').getTime();
  const diff=target-Date.now();
  if(diff<=0)return;
  const d=Math.floor(diff/864e5),h=Math.floor((diff%864e5)/36e5),m=Math.floor((diff%36e5)/6e4),s=Math.floor((diff%6e4)/1e3);
  const el=document.getElementById('cd-timer');
  if(el)el.innerHTML=[
    {v:d,u:'Days'},{v:h,u:'Hrs'},{v:m,u:'Min'},{v:s,u:'Sec'}
  ].map(x=>`<div class="cd-block"><div class="cd-num">${String(x.v).padStart(2,'0')}</div><div class="cd-unit">${x.u}</div></div>`).join('');
}

// === TOAST SYSTEM ===
function showToast(title,msg,type='success'){
  const container=document.getElementById('toast-container');
  const iconMap={success:'checkCircle',error:'xCircle',info:'info'};
  const toast=document.createElement('div');
  toast.className=`toast ${type}`;
  toast.innerHTML=`
    <div class="toast-icon ${type}"><span class="icon-sm">${icons[iconMap[type]]}</span></div>
    <div class="toast-content">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
    </div>
    <button class="toast-close" onclick="this.closest('.toast').remove()"><span class="icon-sm">${icons.x}</span></button>
  `;
  container.appendChild(toast);
  setTimeout(()=>{toast.classList.add('removing');setTimeout(()=>toast.remove(),300)},4500);
}

function navigateTo(page){
  state.page=page;
  renderApp();
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('mobile-nav').classList.remove('open');
  document.getElementById('hamburger-btn').classList.remove('active');
}

function renderApp(){
  const fn=pages[state.page]||pageHome;
  document.getElementById('app').innerHTML=fn()+renderFooter();
  bindPageLinks();
  updateCountdown();
  // Update active nav
  document.querySelectorAll('.nav-link[data-page],.nav-dropdown-link[data-page],.mob-link[data-page]').forEach(a=>{
    a.classList.toggle('active',a.getAttribute('data-page')===state.page);
  });
  // Scroll animations
  requestAnimationFrame(initScrollAnimations);
}

function bindPageLinks(){
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();navigateTo(el.getAttribute('data-page'));});
  });
}

function initScrollAnimations(){
  document.querySelectorAll('.fade-in').forEach(el=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
    },{threshold:.1});
    obs.observe(el);
  });
}

// === TELEGRAM SEND ===
async function sendTelegram(message){
  try{
    const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:message,parse_mode:'HTML'})
    });
    return r.ok;
  }catch(e){console.error(e);return false;}
}

    const salt=saltBase64?Uint8Array.from(atob(saltBase64),c=>c.charCodeAt(0)):crypto.getRandomValues(new Uint8Array(16));
    const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);
    return {hash:btoa(String.fromCharCode(...new Uint8Array(bits))),salt:btoa(String.fromCharCode(...salt))};
  }

  function openTempModal({title,subtitle='',bodyHtml='',actionsHtml='',maxWidth=560}){
    const id=`ext-dialog-${uid()}`;
    const html=`<div id="${id}" class="modal-overlay open">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-container" style="max-width:${maxWidth}px">
        <button class="modal-close" type="button" data-close="1">${icons.x}</button>
        <div class="modal-header">
          <div class="modal-header-icon">${icons.info}</div>
          <h2 class="modal-title">${escapeHTML(title||'')}</h2>
          ${subtitle?`<p class="modal-subtitle">${escapeHTML(subtitle)}</p>`:''}
        </div>
        <div class="modal-body">
          ${bodyHtml||''}
          ${actionsHtml?`<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">${actionsHtml}</div>`:''}
        </div>
      </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend',html);
    const modal=document.getElementById(id);
    const close=()=>{
      if(!modal)return;
      modal.classList.remove('open');
      setTimeout(()=>modal.remove(),180);
    };
    modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',close));
    return {id,modal,close};
  }

  function extConfirm({title,msg,confirmText='Confirm',cancelText='Cancel',danger=false}){
    return new Promise(resolve=>{
      let settled=false;
      const {modal,close}=openTempModal({
        title,
        subtitle:'',
        bodyHtml:`<p style="color:var(--gray-600);font-size:14px;line-height:1.7">${escapeHTML(msg||'')}</p>`,

        maxWidth:520
      });
      const done=v=>{if(settled)return;settled=true;close();resolve(v);};
      modal.querySelector('[data-ok]').addEventListener('click',()=>done(true));
      modal.querySelector('[data-cancel]').addEventListener('click',()=>done(false));
      modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>done(false)));
    });
  }

  function extPrompt({title,label='Value',placeholder='',defaultValue='',type='text',okText='Continue',cancelText='Cancel'}){

      modal.querySelector('[data-cancel]').addEventListener('click',()=>done(null));

  function extFormDialog({title,subtitle='',fields=[],submitText='Save',cancelText='Cancel',maxWidth=560}){
    return new Promise(resolve=>{
      let settled=false;
      const formId=`ext-form-${uid()}`;
      const bodyHtml=`<form id="${formId}">
        ${fields.map(f=>{
          const fid=`${formId}-${f.name}`;
          const label=`<label class="form-label" for="${fid}">${escapeHTML(f.label||f.name)}</label>`;
          const common=`id="${fid}" name="${escapeHTML(f.name)}" ${f.placeholder?`placeholder="${escapeHTML(f.placeholder)}"`:''}`;
          let control='';
          if(f.type==='select'){
            control=`<select ${common} class="form-select">${(f.options||[]).map(o=>`<option value="${escapeHTML(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${escapeHTML(o.label)}</option>`).join('')}</select>`;
          }else if(f.type==='checkbox'){
            control=`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="${fid}" name="${escapeHTML(f.name)}" ${f.value?'checked':''}><span style="font-size:13px;color:var(--gray-600)">${escapeHTML(f.help||'')}</span></label>`;
            return `<div class="form-group" style="margin-bottom:16px">${control}</div>`;
          }else if(f.multiline){
            control=`<textarea ${common} class="form-textarea">${escapeHTML(f.value||'')}</textarea>`;
          }else{
            control=`<input ${common} class="form-input" type="${escapeHTML(f.type||'text')}" value="${escapeHTML(f.value||'')}">`;
          }
          return `<div class="form-group" style="margin-bottom:16px">${label}${control}${f.help?`<div style="margin-top:6px;font-size:12px;color:var(--gray-500)">${escapeHTML(f.help)}</div>`:''}</div>`;
        }).join('')}
      </form>`;
      const {modal,close}=openTempModal({
        title,
        subtitle,
        bodyHtml,
        actionsHtml:`<button class="btn btn-ghost" type="button" data-cancel="1">${escapeHTML(cancelText)}</button><button class="btn btn-primary" type="submit" form="${formId}" data-ok="1">${escapeHTML(submitText)}</button>`,
        maxWidth
      });
      const done=v=>{if(settled)return;settled=true;close();resolve(v);};
      modal.querySelector('[data-cancel]').addEventListener('click',()=>done(null));
      modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>done(null)));
      modal.querySelector(`#${CSS.escape(formId)}`).addEventListener('submit',e=>{
        e.preventDefault();
        const out={};
        fields.forEach(f=>{
          const el=modal.querySelector(`[name="${CSS.escape(f.name)}"]`);
          if(!el){out[f.name]=null;return;}
          if(f.type==='checkbox') out[f.name]=!!el.checked;
          else out[f.name]=(el.value||'').trim();
        });
        done(out);
      });
      setTimeout(()=>modal.querySelector('input,select,textarea')?.focus(),10);
    });
  }

    const name=document.getElementById('ext-reg-name').value.trim();
    const email=document.getElementById('ext-reg-email').value.trim().toLowerCase();
    const pass=document.getElementById('ext-reg-pass').value;
    if(ext.users.find(u=>u.email===email)){showToast('Email exists','Use another email.','error');return;}
    const {hash,salt}=await hashPassword(pass);
    const user={id:uid(),email,password_hash:hash,salt,name,role:'user',provider:'email',active:true,bio:'',progress:0,created_at_custom:now()};
    await api.create('users',user);
    ext.users=await api.list('users');
    state.authUser=ext.users.find(u=>u.email===email)||user;sessionSave();
    closeAuthModal();showToast('Account created','Welcome to SMART platform.','success');renderApp();
  }

  async function submitLogin(e){
    e.preventDefault();
    const email=document.getElementById('ext-login-email').value.trim().toLowerCase();
    const pass=document.getElementById('ext-login-pass').value;
    const user=ext.users.find(u=>u.email===email && u.active!==false);
    if(!user){showToast('Login failed','User not found','error');return;}
    if(user.provider==='google'){showToast('Google account','Use Google sign-in','info');return;}
    const {hash}=await hashPassword(pass,user.salt);
    if(hash!==user.password_hash){showToast('Login failed','Invalid password','error');return;}
    state.authUser=user;sessionSave();
    await api.patch('users',user.id,{last_login:now()});
    await logActivity('login',{method:'email'});
    closeAuthModal();showToast('Welcome back',user.name,'success');renderApp();
  }

  async function googleSignIn(){
    if(window.google && GOOGLE_CLIENT_ID){
      google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:async ({credential})=>{
        const p=JSON.parse(atob(credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        await upsertGoogle(p.email,p.name||'Google User');
      }});
      google.accounts.id.prompt();
    }else{
      const emailRaw=await extPrompt({title:'Demo Google Sign-In',label:'Email',placeholder:'name@example.com',type:'email',okText:'Sign in'});
      if(!emailRaw)return;
      const email=emailRaw.trim().toLowerCase();
      await upsertGoogle(email,email.split('@')[0]);
    }
  }

  async function upsertGoogle(email,name){
    let u=ext.users.find(x=>x.email===email);
    if(!u){u={id:uid(),email,name,role:'user',provider:'google',active:true,bio:'Google user',progress:5,created_at_custom:now(),password_hash:'',salt:''};await api.create('users',u);ext.users=await api.list('users');u=ext.users.find(x=>x.email===email)||u;}
    state.authUser=u;sessionSave();await logActivity('login',{method:'google'});closeAuthModal();showToast('Google Sign-In','Success','success');renderApp();
  }

  async function logout(){await logActivity('logout');state.authUser=null;sessionClear();showToast('Logged out','Session ended.','info');renderApp();}

  function supportConversationId(userId){return `support-${userId}`;}

  function supportUsers(){
    return ext.users.filter(u=>(u.role||'user')==='user' && u.active!==false);
  }

  function supportMessagesByUser(userId){
    return ext.messages.filter(m=>m.conversation_id===supportConversationId(userId) || (m.conversation_id==='support-main' && (m.from_user_id===userId || m.to_role==='user'))).sort((a,b)=>(a.created_at_custom||0)-(b.created_at_custom||0));
  }

  function getActiveSupportTarget(){
    if(role()==='admin'||role()==='moderator'){
      const users=supportUsers();
      if(!users.length)return null;
      if(!users.some(u=>u.id===state.selectedSupportUserId)) state.selectedSupportUserId=users[0].id;
      return users.find(u=>u.id===state.selectedSupportUserId)||users[0];
    }
    return state.authUser;
  }

  function renderSupportInboxPanel(){
    const users=supportUsers().map(u=>{
      const list=supportMessagesByUser(u.id);
      const last=list[list.length-1];
      return {u,last,count:list.length};
    }).sort((a,b)=>(b.last?.created_at_custom||0)-(a.last?.created_at_custom||0));
    return `<aside class="ext-support-users">${users.map(item=>`<button class="ext-support-user-btn ${state.selectedSupportUserId===item.u.id?'active':''}" onclick="state.selectedSupportUserId='${item.u.id}';renderApp()"><div class="ext-support-user-name">${escapeHTML(item.u.name||item.u.email)}</div><div class="ext-support-user-meta">${item.count} msg · ${item.last?new Date(item.last.created_at_custom||now()).toLocaleString():'No conversation yet'}</div></button>`).join('')||'<div style="font-size:13px;color:var(--gray-500);padding:8px">No users available yet.</div>'}</aside>`;
  }

  function renderSupportChatPanel(user){
    const list=user?supportMessagesByUser(user.id):[];
    const subtitle=(role()==='admin'||role()==='moderator')?`Conversation with ${escapeHTML(user?.name||'user')}`:'Talk directly with SMART support team';
    return `<div><div class="ext-support-hero"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="icon-sm" style="color:var(--primary)">${icons.messageCircle}</span><strong>SMART Support Center</strong></div><p style="font-size:13px;opacity:.82">${subtitle}. We keep your past olympiad and certificate requests in one place.</p></div>

  function pageHistory(){

      <section style="padding:34px 0 56px"><div class="container" style="display:grid;gap:14px">${olympiadHistory.map(e=>`<article class="ext-panel"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px"><h3 style="font-size:18px">${e.title}</h3><span class="ext-pill" style="background:var(--gray-100);color:var(--gray-600)">${e.date}</span></div><p style="font-size:13px;color:var(--gray-500);margin:8px 0">Participants: <strong>${e.participants.toLocaleString()}</strong></p><p style="font-size:14px;color:var(--gray-500);line-height:1.7">${e.desc}</p><p style="font-size:13px;margin-top:8px"><strong>Winners:</strong> ${e.winners.join(', ')}</p></article>`).join('')}</div></section></div>`;
  }

  function pagePractice(){
    if(!requireAuth())return pageHome();
    const summary=ext.practiceAttempts.filter(a=>a.user_id===state.authUser.id);
    const avg=summary.length?(summary.reduce((s,a)=>s+(a.score||0),0)/summary.length).toFixed(1):'0';
    const subjects=['All','Science','Math','Academy','Research','Technology'];
    const filtered=practiceBank.filter(q=>state.practiceSubjectFilter==='All'||q.smartSubject===state.practiceSubjectFilter);
    return `<div class="page"><section style="padding:88px 0 28px;background:linear-gradient(135deg,var(--dark),var(--dark-700));text-align:center"><div class="container"><h1 style="color:var(--white);font-size:40px">Practice Zone</h1><p style="color:rgba(255,255,255,.55)">Filter quizzes by SMART subject and track your growth</p></div></section>
      <section style="padding:34px 0 56px"><div class="container"><div class="ext-grid-3" style="margin-bottom:14px"><div class="ext-panel"><div style="font-size:12px;color:var(--gray-500)">Attempts</div><div style="font-size:30px;font-weight:800">${summary.length}</div></div><div class="ext-panel"><div style="font-size:12px;color:var(--gray-500)">Average</div><div style="font-size:30px;font-weight:800">${avg}</div></div><div class="ext-panel"><div style="font-size:12px;color:var(--gray-500)">Best</div><div style="font-size:30px;font-weight:800">${summary.length?Math.max(...summary.map(x=>x.score||0)):0}</div></div></div>
      <div class="ext-panel" style="margin-bottom:14px"><div style="font-size:13px;color:var(--gray-500);margin-bottom:10px">SMART Subject Filter</div><div class="ext-chip-row">${subjects.map(s=>`<button class="ext-chip ${state.practiceSubjectFilter===s?'active':''}" onclick="state.practiceSubjectFilter='${s}';renderApp()">${s}</button>`).join('')}</div></div>
      <div class="ext-panel">${filtered.map((q,idx)=>`<div style="padding:14px 0;border-bottom:${idx===filtered.length-1?'0':'1px solid var(--gray-200)'}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3 style="font-size:15px">${idx+1}. ${q.q}</h3><span class="ext-pill" style="background:var(--primary-subtle);color:var(--primary-dark)">${q.smartSubject} · ${q.category} · ${q.difficulty}</span></div><div style="margin-top:8px;display:grid;gap:6px">${q.choices.map((c,i)=>`<label style="display:flex;gap:8px;align-items:start"><input type="radio" name="pq-${q.id}" value="${i}"><span>${c}</span></label>`).join('')}</div></div>`).join('')||'<p style="font-size:13px;color:var(--gray-500)">No practice questions found for this SMART subject yet.</p>'}<button class="btn btn-primary" style="margin-top:14px" onclick="submitPracticeExt()">Submit Practice</button></div></div></section></div>`;
  }

  async function submitPractice(){
    if(!state.authUser)return;
    let score=0;
    const details=[];
    const activeQuestions=practiceBank.filter(q=>state.practiceSubjectFilter==='All'||q.smartSubject===state.practiceSubjectFilter);
    if(!activeQuestions.length){showToast('No questions','Please choose a subject with available practice.','info');return;}
    activeQuestions.forEach(q=>{
      const picked=Number(document.querySelector(`input[name="pq-${q.id}"]:checked`)?.value);
      const ok=picked===q.correct;
      if(ok)score+=Math.round(100/activeQuestions.length);
      details.push({q:q.id,picked,correct:q.correct,ok,subject:q.smartSubject});
    });
    const row={id:uid(),user_id:state.authUser.id,score,details:JSON.stringify(details),created_at_custom:now()};
    await api.create('practice_attempts',row);
    ext.practiceAttempts=await api.list('practice_attempts');
    await logActivity('practice_submit',{score});
    showToast('Practice submitted',`Score: ${score}`,'success');
    renderApp();
  }

  function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  function clearSupportImage(){
    state.supportImageData=null;
    state.supportImageName='';
    renderApp();
  }

  function bindSupportImageInput(){
    const input=document.getElementById('support-img');
    if(!input || input.dataset.bound)return;
    input.dataset.bound='1';
    input.addEventListener('change',async ()=>{
      const file=input.files && input.files[0];
      if(!file)return;
      if(!String(file.type||'').startsWith('image/')){
        showToast('Invalid file','Please choose an image.','error');
        input.value='';
        return;
      }
      if(file.size>2.5*1024*1024){
        showToast('Image too large','Please use an image under 2.5 MB.','error');
        input.value='';
        return;
      }
      try{
        const data=await fileToDataURL(file);
        state.supportImageData=String(data||'');
        state.supportImageName=file.name||'Image';
        renderApp();
      }catch{
        showToast('Upload failed','Could not read the image.','error');
      }finally{
        input.value='';
      }
    });
  }

  async function sendSupportMessage(e){
    e.preventDefault();
    const input=document.getElementById('support-msg');
    const text=(input?.value||state.supportDraft||'').trim();
    const image_data=state.supportImageData;
    const image_name=state.supportImageName;
    if(!text && !image_data)return;
    const target=getActiveSupportTarget();
    if(!target){showToast('No target user','Select a user first.','info');return;}
    await api.create('messages',{id:uid(),conversation_id:supportConversationId(target.id),from_user_id:state.authUser.id,to_role:(role()==='admin'||role()==='moderator')?'user':'support',text,read:false,image_data,image_name,created_at_custom:now()});
    await logActivity('support_message',{length:text.length,image:!!image_data,target:target.id});
    ext.messages=await api.list('messages');
    state.supportDraft='';
    state.supportCursor=0;
    state.supportImageData=null;
    state.supportImageName='';
    if(input)input.value='';
    renderApp();
  }

  async function saveProfile(e){
    e.preventDefault();
    const name=document.getElementById('ext-p-name').value.trim();
    const bio=document.getElementById('ext-p-bio').value.trim();
    await api.patch('users',state.authUser.id,{name,bio});
    await logActivity('profile_update',{});
    ext.users=await api.list('users');state.authUser=ext.users.find(u=>u.id===state.authUser.id)||state.authUser;
    showToast('Saved','Profile updated.','success');renderApp();
  }

  function viewUser(id){
    const u=ext.users.find(x=>x.id===id); if(!u)return;
    extAlert({
      title:'User Details',
      msg:`<div class="card" style="padding:16px">
        <div style="display:grid;gap:10px">
          <div><div style="font-size:12px;color:var(--gray-500)">Name</div><div style="font-weight:800">${escapeHTML(u.name||'')}</div></div>
          <div><div style="font-size:12px;color:var(--gray-500)">Email</div><div style="font-weight:700">${escapeHTML(u.email||'')}</div></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <div class="ext-pill" style="background:var(--primary-subtle);color:var(--primary-dark)">Role: ${escapeHTML(u.role||'user')}</div>
            <div class="ext-pill" style="background:${u.active===false?'rgba(239,68,68,.12)':'rgba(16,185,129,.12)'};color:${u.active===false?'#ef4444':'#10b981'}">Status: ${u.active===false?'Banned':'Active'}</div>
            <div class="ext-pill" style="background:rgba(59,130,246,.12);color:#3b82f6">Progress: ${escapeHTML(String(u.progress||0))}%</div>
          </div>
        </div>
      </div>`
    });
  }

  async function toggleUserBan(id){
    const u=ext.users.find(x=>x.id===id); if(!u)return;
    await api.patch('users',id,{active:u.active===false?true:false});
    await logActivity('user_ban_toggle',{target:id,nextActive:u.active===false});
    ext.users=await api.list('users');
    renderApp();
  }

  async function changeRole(id){
    if(state.authUser.role!=='admin'){showToast('Forbidden','Only admin can change roles','error');return;}
    const u=ext.users.find(x=>x.id===id);
    const out=await extFormDialog({
      title:'Change Role',
      subtitle: u?`User: ${u.email}`:'',
      submitText:'Update Role',
      fields:[{name:'role',label:'Role',type:'select',value:(u?.role||'user'),options:[
        {value:'user',label:'User'},
        {value:'moderator',label:'Moderator'},
        {value:'admin',label:'Admin'}
      ]}]
    });
    if(!out)return;
    const role=(out.role||'').trim();
    if(!['admin','moderator','user'].includes(role))return;
    await api.patch('users',id,{role});
    await logActivity('role_change',{target:id,role});
    ext.users=await api.list('users');renderApp();
  }

  async function deleteUser(id){
    if(state.authUser.role!=='admin')return;
    const u=ext.users.find(x=>x.id===id);
    const ok=await extConfirm({title:'Delete user?',msg:`This will remove ${u?.email||'this user'} from the system.`,confirmText:'Delete',cancelText:'Cancel',danger:true});
    if(!ok)return;
    await api.remove('users',id);
    await logActivity('delete_user',{target:id});
    ext.users=await api.list('users');renderApp();
  }

  async function createCourse(){
    const out=await extFormDialog({
      title:'Create Course',
      subtitle:'Adds a course to the UI dataset (demo).',
      submitText:'Create',
      fields:[
        {name:'title',label:'Course title',placeholder:'e.g., Intro to Robotics',value:''},
        {name:'cat',label:'Category',type:'select',value:'Technology',options:[
          {value:'Science',label:'Science'},
          {value:'Math',label:'Math'},
          {value:'Academy',label:'Academy'},
          {value:'Research',label:'Research'},
          {value:'Technology',label:'Technology'}
        ]},
        {name:'level',label:'Level',type:'select',value:'Beginner',options:[
          {value:'Beginner',label:'Beginner'},
          {value:'Intermediate',label:'Intermediate'},
          {value:'Advanced',label:'Advanced'}
        ]}
      ]
    });
    if(!out)return;
    const title=(out.title||'').trim(); if(!title)return;
    const cat=(out.cat||'Technology').trim()||'Technology';
    const level=(out.level||'Beginner').trim()||'Beginner';
    courses.push({id:'ext-'+uid().slice(0,8),title,cat,sub:cat,level,dur:'8 wk',mods:16,price:199000,rating:4.8,students:0,desc:'Admin created course',detail:'',prereqs:['None'],learn:['TBD'],instr:'SMART Team'});
    await logActivity('create_course',{title});
    showToast('Created','Course added in UI dataset.','success');renderApp();
  }

  function editCourse(id){
    const c=courses.find(x=>x.id===id); if(!c)return;
    extFormDialog({
      title:'Edit Course',
      subtitle:`ID: ${c.id}`,
      submitText:'Save',
      fields:[
        {name:'title',label:'Title',value:c.title||''},
        {name:'cat',label:'Category',type:'select',value:c.cat||'Technology',options:[
          {value:'Science',label:'Science'},
          {value:'Math',label:'Math'},
          {value:'Academy',label:'Academy'},
          {value:'Research',label:'Research'},
          {value:'Technology',label:'Technology'}
        ]},
        {name:'level',label:'Level',type:'select',value:c.level||'Beginner',options:[
          {value:'Beginner',label:'Beginner'},
          {value:'Intermediate',label:'Intermediate'},
          {value:'Advanced',label:'Advanced'}
        ]}
      ]
    }).then(out=>{
      if(!out)return;
      const title=(out.title||'').trim(); if(!title)return;
      c.title=title; c.cat=(out.cat||c.cat); c.sub=c.cat; c.level=(out.level||c.level);
      logActivity('edit_course',{id});
      renderApp();
    });
  }

  async function createResult(){
    const out=await extFormDialog({
      title:'Upload Result',
      subtitle:'Adds a published result entry.',
      submitText:'Publish',
      fields:[
        {name:'email',label:'User email',placeholder:'name@example.com',value:''},
        {name:'exam',label:'Exam name',value:'SMART Olympiad 2026'},
        {name:'score',label:'Score',type:'number',value:'85'},
        {name:'grade',label:'Grade',type:'select',value:'B+',options:GRADE_ORDER.map(g=>({value:g,label:g}))}
      ],
      maxWidth:640
    });
    if(!out)return;
    const email=(out.email||'').trim().toLowerCase();
    const user=ext.users.find(u=>u.email===email);
    if(!user){showToast('Not found','User email not found','error');return;}
    const exam=(out.exam||'SMART Olympiad 2026').trim()||'SMART Olympiad 2026';
    const score=Number(out.score||85);
    const grade=(out.grade||'B+').trim()||'B+';
    if(!GRADE_ORDER.includes(grade)){showToast('Invalid grade','Use A+ ... F','error');return;}
    await api.create('results',{id:uid(),user_id:user.id,exam_name:exam,score,grade,published:true,notes:'Published by admin',issued_at:now()});
    await logActivity('create_result',{user:user.id,exam,score,grade});
    ext.results=await api.list('results');
    if(grade==='A+')launchConfetti();
    renderApp();
  }

  async function editResult(id){
    const r=ext.results.find(x=>x.id===id);if(!r)return;
    const out=await extFormDialog({
      title:'Edit Result',
      subtitle:r.exam_name||'Result',
      submitText:'Save',
      fields:[
        {name:'grade',label:'Grade',type:'select',value:r.grade||'B',options:GRADE_ORDER.map(g=>({value:g,label:g}))},
        {name:'published',label:'Published',type:'checkbox',value:!!r.published,help:'Visible to the user in Results Center'}
      ]
    });
    if(!out)return;
    const grade=(out.grade||r.grade).trim()||r.grade;
    const pub=!!out.published;
    await api.patch('results',id,{grade,published:pub});
    await logActivity('edit_result',{id,grade,published:pub});
    ext.results=await api.list('results');
    if(grade==='A+')launchConfetti();
    renderApp();
  }

  async function toggleSection(id,nextState){await api.patch('content_sections',id,{enabled:nextState});await logActivity('toggle_section',{id,nextState});ext.sections=await api.list('content_sections');renderApp();}

  async function toggleFavorite(courseId){
    if(!state.authUser){showToast('Login required','Please login to save favorites','info');return;}
    const ex=ext.bookmarks.find(b=>b.user_id===state.authUser.id&&b.course_id===courseId);
    if(ex) await api.remove('bookmarks',ex.id);
    else await api.create('bookmarks',{id:uid(),user_id:state.authUser.id,course_id:courseId,created_at_custom:now()});
    ext.bookmarks=await api.list('bookmarks');
    renderApp();
  }

  function decorateCourseCards(){
    if(state.page!=='courses')return;
    const favs=new Set(ext.bookmarks.filter(b=>state.authUser&&b.user_id===state.authUser.id).map(b=>b.course_id));
    document.querySelectorAll('.course-card').forEach(card=>{
      const on=card.getAttribute('onclick')||'';
      const m=on.match(/openCourseDetail\('([^']+)'\)/);
      if(!m) return;
      const cid=m[1];
      if(card.querySelector('.fav-btn')) return;
      card.style.position='relative';
      const btn=document.createElement('button');
      btn.className='fav-btn'+(favs.has(cid)?' active':'');
      btn.textContent=favs.has(cid)?'★ Saved':'☆ Save';
      btn.addEventListener('click',(e)=>{e.stopPropagation();e.preventDefault();toggleFavorite(cid);});
      card.appendChild(btn);
    });
  }

  async function downloadResultPdf(id){
    const row=ext.results.find(r=>r.id===id); if(!row)return;
    const user=ext.users.find(u=>u.id===row.user_id);
    const jspdf=window.jspdf; if(!jspdf){showToast('PDF','jsPDF not loaded','error');return;}
    const doc=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const w=297,h=210;
    doc.setFillColor(250,248,242); doc.rect(0,0,w,h,'F');
    doc.setDrawColor(247,165,36); doc.setLineWidth(1.3); doc.roundedRect(8,8,w-16,h-16,4,4,'S');
    doc.setDrawColor(31,41,55); doc.setLineWidth(.3); doc.roundedRect(12,12,w-24,h-24,3,3,'S');
    doc.setTextColor(180,120,20); doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('SMART OLYMPIAD',w/2,26,{align:'center'});
    doc.setTextColor(17,24,39); doc.setFontSize(30); doc.text('Certificate of Achievement',w/2,42,{align:'center'});
    doc.setFont('times','italic'); doc.setFontSize(16); doc.text('This is proudly presented to',w/2,58,{align:'center'});
    doc.setFont('times','bold'); doc.setFontSize(28); doc.setTextColor(111,76,20); doc.text(user?.name||'Participant',w/2,76,{align:'center'});
    doc.setDrawColor(247,165,36); doc.setLineWidth(.4); doc.line(70,80,w-70,80);
    doc.setTextColor(31,41,55); doc.setFont('helvetica','normal'); doc.setFontSize(13);
    doc.text(`for outstanding performance in ${row.exam_name||'SMART Olympiad'}`,w/2,93,{align:'center'});
    doc.text(`Score: ${row.score}   •   Grade: ${row.grade}`,w/2,103,{align:'center'});
    doc.text(`Issued on ${new Date(row.issued_at||now()).toLocaleDateString()}`,w/2,113,{align:'center'});
    doc.setFontSize(11); doc.setTextColor(75,85,99);
    doc.text(`Certificate ID: ${(row.id||'').slice(0,8).toUpperCase()}-${(row.user_id||'').slice(0,6).toUpperCase()}`,w/2,125,{align:'center'});
    doc.setFont('times','italic'); doc.setTextColor(17,24,39); doc.setFontSize(14); doc.text('SMART Academic Board',55,176,{align:'center'});
    doc.line(28,172,82,172);
    doc.setFont('times','italic'); doc.text('Director of Olympiad',w-55,176,{align:'center'});
    doc.line(w-82,172,w-28,172);
    doc.setFillColor(247,165,36); doc.circle(w/2,170,10,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('S',w/2,175,{align:'center'});

    const existing=ext.issuedCertificates.find(c=>c.result_id===row.id && c.user_id===row.user_id);
    if(!existing){
      await api.create('issued_certificates',{id:uid(),user_id:row.user_id,result_id:row.id,exam_name:row.exam_name,grade:row.grade,score:row.score,created_at_custom:now()});
      ext.issuedCertificates=await api.list('issued_certificates');
    }
    await logActivity('certificate_download',{result_id:row.id,grade:row.grade});
    doc.save(`smart-certificate-${(user?.name||'result').replace(/\s+/g,'_')}.pdf`);
    showToast('Certificate saved','Certificate added to Dashboard achievements.','success');
  }

  async function refreshData(){
    [ext.users,ext.results,ext.bookmarks,ext.messages,ext.sections,ext.notifications,ext.activityLogs,ext.errorLogs,ext.practiceAttempts,ext.issuedCertificates]=await Promise.all([
      api.list('users'),api.list('results'),api.list('bookmarks'),api.list('messages'),api.list('content_sections'),api.list('notifications'),api.list('activity_logs'),api.list('error_logs'),api.list('practice_attempts'),api.list('issued_certificates')
    ]);
    if(state.authUser) state.authUser=ext.users.find(u=>u.id===state.authUser.id)||null;
  }

  // Extend routes without rewriting existing architecture
  pages.results=pageResults;
  pages.dashboard=pageDashboard;
  pages.support=pageSupport;
  pages.admin=pageAdmin;
  pages.testimonials=pageTestimonials;
  pages.history=pageHistory;
  pages.practice=pagePractice;

  // Wrap renderApp for post-render enhancement
  const originalRenderApp=renderApp;
  renderApp=function(){
    const active=document.activeElement;
    const wasSupportTyping=active && active.id==='support-msg';
    if(wasSupportTyping){
      state.supportDraft=active.value;
      state.supportCursor=active.selectionStart||active.value.length;
    }
    originalRenderApp();
    injectNavExtras();
    refreshAuthUI();
    applySectionControls();
    decorateCourseCards();
    if(state.page==='dashboard'){
      const b=document.getElementById('dash-notif-open');
      if(b && !b.dataset.bound){
        b.dataset.bound='1';
        b.addEventListener('click',openNotifications);
      }
    }
    if(state.page==='support' || (state.page==='admin' && state.adminTab==='support')){
      bindSupportImageInput();
      const input=document.getElementById('support-msg');
      if(input){
        input.value=state.supportDraft||'';
        const pos=Math.min(state.supportCursor||input.value.length,input.value.length);
        if(wasSupportTyping){input.focus();input.setSelectionRange(pos,pos);}
      }
    }
    if(state.authUser && state.lastPageTrack!==state.page){
      state.lastPageTrack=state.page;
      logActivity('page_view',{page:state.page});
    }
  };

  // Expose handlers
  window.openAuthModal=openAuthModal;
  window.closeAuthModalExt=closeAuthModal;
  window.renderLoginExt=renderLogin;
  window.renderRegisterExt=renderRegister;
  window.submitRegisterExt=submitRegister;
  window.submitLoginExt=submitLogin;
  window.googleSignInExt=googleSignIn;
  window.requestPasswordResetExt=requestPasswordReset;
  window.saveProfileExt=saveProfile;
  window.sendSupportMessageExt=sendSupportMessage;
  window.clearSupportImageExt=clearSupportImage;
  window.viewUserExt=viewUser;
  window.toggleUserBanExt=toggleUserBan;
  window.changeRoleExt=changeRole;
  window.deleteUserExt=deleteUser;
  window.createCourseExt=createCourse;
  window.editCourseExt=editCourse;
  window.createResultExt=createResult;
  window.editResultExt=editResult;
  window.toggleSectionExt=toggleSection;
  window.downloadResultPdfExt=downloadResultPdf;
  window.submitPracticeExt=submitPractice;

  // Boot extension
  extStyle();
  if(state.theme==='dark') document.body.classList.add('theme-dark');

  window.addEventListener('error',e=>{logError(e.message||'Unknown error','window.error');});
  window.addEventListener('unhandledrejection',e=>{logError(e.reason?.message||String(e.reason||'Unhandled rejection'),'promise');});

  bootstrapData().then(()=>{
    setInterval(async()=>{
      const prevSig=state.supportLastSignature;
      await refreshData();
      const latest=ext.messages.filter(m=>(m.conversation_id||'').startsWith('support-')).sort((a,b)=>(a.created_at_custom||0)-(b.created_at_custom||0));
      const currSig=`${latest.length}-${latest.at(-1)?.id||'none'}`;
      state.supportLastSignature=currSig;
      if((state.page==='support' || (state.page==='admin' && state.adminTab==='support')) && currSig!==prevSig) renderApp();
      refreshAuthUI();
    },2800);
    renderApp();
  });
})();
</script>
